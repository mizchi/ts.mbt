name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: Moon update
        # `moon update` clones the registry index (needed for dependency
        # resolution) and then downloads `symbols.zip` (IDE/autocomplete
        # metadata only). The latter intermittently 403s from its CDN and
        # makes `moon update` exit non-zero *after* the index is already
        # in place, which would skip the entire test suite. Swallow the
        # failure here — a genuine index/resolution problem still surfaces
        # at the `Moon check` / `Moon test` steps below.
        run: moon update || true

      - name: Patch deprecated `fn new()` in moonbitlang/async
        # The bleeding-edge MoonBit toolchain (`latest`) hard-errors on
        # `fn new(..)` declared inside a `struct`, which async@0.18.1 still
        # uses. Patch the shared registry cache so the top-level build *and*
        # every scaffolded fixture pick up the fix. See the script header.
        run: bash scripts/patch_async_dep.sh

      - name: Moon fmt check
        # Reported, not enforced, for the same reason `--deny-warn` is left
        # to local `just check` below: the formatter's output depends on the
        # toolchain version, and `latest` is the only stable URL on
        # `cli.moonbitlang.com`, so CI's formatter drifts away from every
        # contributor's pinned one.
        #
        # This is not a hypothetical. CI's formatter wanted a trailing comma
        # in three files nobody had touched since June —
        # `src/bridge/oracle.mbt`, `moonbit_js_ffi.mbt` and
        # `tagged_union_lowering.mbt` (`Some({ name: type_alias.name, cases })`
        # at tagged_union_lowering.mbt:800) — and moon 0.1.20260819 REMOVED
        # that comma again on the next local `moon fmt`. The two formatters
        # actively disagreed, so no state of the source satisfied both:
        # adding the commas was not a fix that could hold, it just moved
        # which side was red.
        #
        # THAT DISAGREEMENT IS OVER, in the direction CI wanted. The tree was
        # formatted with moon 0.1.20260915 / moonc v0.10.13 — `latest` at the
        # time, so the same formatter this step runs — which put the trailing
        # comma in, across 73 files. `moon fmt --check` passes as of that
        # commit, and the formatter is idempotent on the result (a second
        # `moon fmt` changes nothing, verified by diffing both passes).
        #
        # So the step is green rather than permanently red, and it is STILL
        # not enforced, because what made it unenforceable was never that one
        # comma: it is that this job tracks `latest` while contributors pin,
        # so the next formatter change re-opens the same gap in whichever
        # direction it moves. A hard-failing check here costs the thing a
        # check is for — it was red on every pull request for a reason
        # unrelated to any of them, which means it stopped being able to say
        # anything about them, and a signal that is always red is a signal
        # people learn to merge past. Reporting it keeps the drift visible
        # without that.
        #
        # What HAS changed is the direction of the risk. The tree now matches
        # `latest`, so a contributor on an older pinned toolchain can
        # reformat it back and turn this step red again. The fix if that
        # happens is to re-run `moon fmt` on `latest`, not to hand-edit the
        # commas.
        #
        # The alternative is pinning CI's MoonBit to the version
        # contributors run. That is the stronger fix and deliberately not
        # taken here: the two steps around this one exist to keep tracking
        # `latest` so real toolchain breakage surfaces early, and pinning
        # would trade that away for a formatting check.
        continue-on-error: true
        run: moon fmt --check

      - name: Moon check
        # `--deny-warn` is left to local `just check`; CI's MoonBit
        # toolchain is bleeding-edge (`latest` is the only stable URL on
        # `cli.moonbitlang.com`) and treating fresh deprecation warnings
        # as errors flakes CI on toolchain churn.
        run: moon check

      - name: Moon test
        run: moon test --target native

      - name: Verify mbti -> .d.ts
        run: just verify-mbti-dts

      - name: Verify scaffolds
        run: just verify-scaffolds

      - name: Verify generated fixtures
        run: just verify-generated-fixtures

      - name: Verify examples
        run: just verify-examples

      # Differential validation of `mtsc --mangle-properties`: each case in
      # fixtures/mangle-safety is compiled with and without property
      # mangling, both bundles are run under Node, and the observations are
      # diffed. A difference means a renamed property was observable. The
      # recipe also re-derives fixtures/mangle-safety/generated from the
      # safety model and fails if the checked-in cases have drifted.
      - name: Verify mangle safety
        run: just verify-mangle-safety

  # Soundness gate against the TypeScript conformance corpus. Kept in a
  # separate job because it needs the (large) `typescript` submodule, which
  # the main `test` job deliberately skips to stay fast.
  checker-soundness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Moon update
        run: moon update || true

      - name: Patch deprecated `fn new()` in moonbitlang/async
        # See the matching step in the `test` job + the script header.
        run: bash scripts/patch_async_dep.sh

      # Builds the `tscheck` binary and fails if the checker reports more
      # conformance false positives than the documented budget.
      - name: Verify checker soundness
        run: just verify-checker-soundness
