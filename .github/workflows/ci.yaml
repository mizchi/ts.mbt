name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: Moon update
        # `moon update` clones the registry index (needed for dependency
        # resolution) and then downloads `symbols.zip` (IDE/autocomplete
        # metadata only). The latter intermittently 403s from its CDN and
        # makes `moon update` exit non-zero *after* the index is already
        # in place, which would skip the entire test suite. Swallow the
        # failure here — a genuine index/resolution problem still surfaces
        # at the `Moon check` / `Moon test` steps below.
        run: moon update || true

      - name: Patch deprecated `fn new()` in moonbitlang/async
        # The bleeding-edge MoonBit toolchain (`latest`) now rejects
        # `fn new(..)` declared *inside* a `struct` as a hard error, but
        # moonbitlang/async@0.18.1 still uses that form. Its toplevel
        # `Type::new` implementations already exist, so the in-struct
        # signatures are redundant; drop them so `moon check` / `moon test`
        # build the dependency. Remove once async ships a release migrated to
        # the new constructor syntax (or the toolchain is pinnable).
        run: |
          moon install >/dev/null 2>&1 || true
          find .mooncakes/moonbitlang/async/src -name '*.mbt' ! -name '*.mbti' -print0 \
            | xargs -0 sed -i -E '/^[[:space:]]+fn(\[[^]]*\])? new\(.*\) -> /d'

      - name: Moon fmt check
        run: moon fmt --check

      - name: Moon check
        # `--deny-warn` is left to local `just check`; CI's MoonBit
        # toolchain is bleeding-edge (`latest` is the only stable URL on
        # `cli.moonbitlang.com`) and treating fresh deprecation warnings
        # as errors flakes CI on toolchain churn.
        run: moon check

      - name: Moon test
        run: moon test --target native

      - name: Verify mbti -> .d.ts
        run: just verify-mbti-dts

      - name: Verify scaffolds
        run: just verify-scaffolds

      - name: Verify generated fixtures
        run: just verify-generated-fixtures

      - name: Verify examples
        run: just verify-examples

  # Soundness gate against the TypeScript conformance corpus. Kept in a
  # separate job because it needs the (large) `typescript` submodule, which
  # the main `test` job deliberately skips to stay fast.
  checker-soundness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Moon update
        run: moon update || true

      - name: Patch deprecated `fn new()` in moonbitlang/async
        # See the matching step in the `test` job: the latest toolchain
        # hard-errors on async@0.18.1's in-struct `fn new(..)`; its toplevel
        # `Type::new` impls already exist, so drop the redundant signatures.
        run: |
          moon install >/dev/null 2>&1 || true
          find .mooncakes/moonbitlang/async/src -name '*.mbt' ! -name '*.mbti' -print0 \
            | xargs -0 sed -i -E '/^[[:space:]]+fn(\[[^]]*\])? new\(.*\) -> /d'

      # Builds the `tscheck` binary and fails if the checker reports more
      # conformance false positives than the documented budget.
      - name: Verify checker soundness
        run: just verify-checker-soundness
