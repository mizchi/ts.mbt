name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install npm dependencies
        run: pnpm install --frozen-lockfile

      - name: Moon update
        # `moon update` clones the registry index (needed for dependency
        # resolution) and then downloads `symbols.zip` (IDE/autocomplete
        # metadata only). The latter intermittently 403s from its CDN and
        # makes `moon update` exit non-zero *after* the index is already
        # in place, which would skip the entire test suite. Swallow the
        # failure here — a genuine index/resolution problem still surfaces
        # at the `Moon check` / `Moon test` steps below.
        run: moon update || true

      - name: Patch deprecated `fn new()` in moonbitlang/async
        # The bleeding-edge MoonBit toolchain (`latest`) hard-errors on
        # `fn new(..)` declared inside a `struct`, which async@0.18.1 still
        # uses. Patch the shared registry cache so the top-level build *and*
        # every scaffolded fixture pick up the fix. See the script header.
        run: bash scripts/patch_async_dep.sh

      - name: Moon fmt check
        # ENFORCED. `latest` is the reference formatter, and that is the
        # settled policy rather than a compromise: the two steps around
        # this one exist to track `latest` so real toolchain breakage
        # surfaces early, and the tree is formatted to it, so the same
        # `latest` decides this check. A contributor's pinned toolchain is
        # not a second reference that has to be reconciled with.
        #
        # It was reported-and-not-enforced for a while, and the reason has
        # gone away. CI's formatter wanted a trailing comma in three files
        # nobody had touched since June — `src/bridge/oracle.mbt`,
        # `moonbit_js_ffi.mbt` and `tagged_union_lowering.mbt`
        # (`Some({ name: type_alias.name, cases })` at
        # tagged_union_lowering.mbt:800) — and moon 0.1.20260819 REMOVED
        # that comma again on the next local `moon fmt`. The two formatters
        # actively disagreed, so no state of the source satisfied both:
        # adding the commas was not a fix that could hold, it just moved
        # which side was red. A check that is red on every pull request for
        # a reason unrelated to any of them has stopped being able to say
        # anything about them, which is why it was not a gate then.
        #
        # THAT DISAGREEMENT IS OVER, in the direction CI wanted. The tree
        # was formatted with moon 0.1.20260915 / moonc v0.10.13 — `latest`
        # at the time, so the same formatter this step runs — which put the
        # trailing comma in, across 73 files. `moon fmt --check` passes as
        # of that commit, and the formatter is idempotent on the result (a
        # second `moon fmt` changes nothing, verified by diffing both
        # passes).
        #
        # So both ways this can now go red are ACTIONABLE, which is the
        # condition a gate needs and the thing that was missing:
        #   - `latest`'s formatter changed: re-run `moon fmt` on `latest`
        #     and commit the result. Never hand-edit the commas.
        #   - somebody reformatted the tree with an older pinned
        #     toolchain: same fix.
        #
        # The cost that accepts, stated rather than discovered: the next
        # time `latest`'s formatter changes, every open pull request goes
        # red until someone runs `moon fmt` on `latest`. The
        # 20260819 -> 20260915 comma change suggests that is months apart,
        # not days. If it ever becomes the wrong trade, `continue-on-error:
        # true` on this step is a one-line revert — but pinning CI's
        # MoonBit is not the answer, because it trades away the early
        # warning the surrounding steps are here for.
        run: moon fmt --check

      - name: Moon check
        # `--deny-warn` is left to local `just check`; CI's MoonBit
        # toolchain is bleeding-edge (`latest` is the only stable URL on
        # `cli.moonbitlang.com`) and treating fresh deprecation warnings
        # as errors flakes CI on toolchain churn.
        run: moon check

      - name: Moon test
        run: moon test --target native

      - name: Verify mbti -> .d.ts
        run: just verify-mbti-dts

      - name: Verify scaffolds
        run: just verify-scaffolds

      - name: Verify generated fixtures
        run: just verify-generated-fixtures

      - name: Verify examples
        run: just verify-examples

      # Differential validation of `mtsc --mangle-properties`: each case in
      # fixtures/mangle-safety is compiled with and without property
      # mangling, both bundles are run under Node, and the observations are
      # diffed. A difference means a renamed property was observable. The
      # recipe also re-derives fixtures/mangle-safety/generated from the
      # safety model and fails if the checked-in cases have drifted.
      - name: Verify mangle safety
        run: just verify-mangle-safety

  # Soundness gate against the TypeScript conformance corpus. Kept in a
  # separate job because it needs the (large) `typescript` submodule, which
  # the main `test` job deliberately skips to stay fast.
  checker-soundness:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Moon update
        run: moon update || true

      - name: Patch deprecated `fn new()` in moonbitlang/async
        # See the matching step in the `test` job + the script header.
        run: bash scripts/patch_async_dep.sh

      # Builds the `tscheck` binary and fails if the checker reports more
      # conformance false positives than the documented budget.
      - name: Verify checker soundness
        run: just verify-checker-soundness
