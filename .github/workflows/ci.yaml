name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  WASMTIME_VERSION: 43.0.1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install wasmtime
        run: |
          set -eux
          version="v${WASMTIME_VERSION}"
          asset="wasmtime-${version}-x86_64-linux.tar.xz"
          url="https://github.com/bytecodealliance/wasmtime/releases/download/${version}/${asset}"
          tmp_dir="$(mktemp -d)"
          curl -fsSL "$url" -o "$tmp_dir/wasmtime.tar.xz"
          tar -xJf "$tmp_dir/wasmtime.tar.xz" -C "$tmp_dir"
          mkdir -p "$HOME/.wasmtime/bin"
          install "$tmp_dir/wasmtime-${version}-x86_64-linux/wasmtime" "$HOME/.wasmtime/bin/wasmtime"
          echo "$HOME/.wasmtime/bin" >> "$GITHUB_PATH"

      - name: Moon update
        run: moon update

      - name: Moon check
        run: moon check --deny-warn

      - name: Moon test
        run: moon test --target native
